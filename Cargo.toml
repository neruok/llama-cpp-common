[package]
name = "llama-cpp-common"
description = "Bindings to llama.cpp's common/ helpers for llama-cpp-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neruok/llama-cpp-common"

[dependencies]
# The fork pin carries the raw-handle accessors this crate needs. It moves to a
# released or upstream revision once the accessors land.
llama-cpp-2 = { git = "https://github.com/neruok/llama-cpp-rs", rev = "262eab2cb2633e8263716441dd0cdcb839c8177f" }
llama-cpp-sys-2 = { git = "https://github.com/neruok/llama-cpp-rs", rev = "262eab2cb2633e8263716441dd0cdcb839c8177f" }

[build-dependencies]
cc = "1"

[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }
