[package]
name = "llama-cpp-common"
description = "Bindings to llama.cpp's common/ helpers for llama-cpp-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neruok/llama-cpp-common"

[dependencies]
# The fork pin carries the raw-handle accessors this crate needs. `common` is
# disabled because this crate builds the `common` helpers itself.
llama-cpp-2 = { git = "https://github.com/neruok/llama-cpp-rs", rev = "51277d0c19e4546eac660bd933a4547fddba01a9", default-features = false, features = ["openmp"] }
llama-cpp-sys-2 = { git = "https://github.com/neruok/llama-cpp-rs", rev = "51277d0c19e4546eac660bd933a4547fddba01a9", default-features = false, features = ["openmp"] }
thiserror = "2"

[build-dependencies]
cc = "1"
